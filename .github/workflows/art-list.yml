name: Generate Art List

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  art-list:
    name: Generate Art List
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytz
          pip install pillow   # ← REQUIRED for PIL.Image

      - name: Generate Art List
        run: |
          python ./.github/workflows/art-list.py
        
      - name: Push Art List
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: '.'
          destination-github-username: 'Squishy6094'
          destination-repository-name: 'squishy-site-art-gallery'
          user-email: squishy6094@gmail.com
          target-branch: main
          commit-message: Autogen Art List
